[project]
name = "always-us-backend"
version = "0.1.0"
description = "Always Us FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.20.0",
    "anyio==4.7.0",
    "argon2-cffi==23.1.0",
    "argon2-cffi-bindings==26.1.0",
    "certifi==2024.12.14",
    "cffi==1.17.1",
    "click==8.1.8",
    "cryptography==44.0.0",
    "ecdsa==0.19.0",
    "fastapi==0.115.6",
    "greenlet==3.1.1",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "httptools==0.6.4",
    "httpx==0.28.1",
    "idna==3.10",
    "Mako==1.3.8",
    "MarkupSafe==3.0.2",
    "packaging==24.2",
    "passlib==1.7.4",
    "pillow==11.0.0",
    "pyasn1==0.6.1",
    "pycparser==2.22",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pydantic_core==2.27.2",
    "pyjwt==2.10.1",
    "python-dotenv==1.0.1",
    "python-jose==3.3.0",
    "python-multipart==0.0.20",
    "PyYAML==6.0.2",
    "rsa==4.9",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.36",
    "starlette==0.41.3",
    "typing_extensions==4.12.2",
    "uvicorn==0.34.0",
    "uvloop==0.21.0; sys_platform != 'win32'",
    "watchfiles==1.0.3",
    "websockets==14.1"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
